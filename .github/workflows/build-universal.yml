name: Build universal plugin (Intel + Apple Silicon)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        td_version: [2023, 2025]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config

      - name: Cache x86_64 dependencies
        uses: actions/cache@v4
        with:
          path: build_deps
          key: deps-x86_64-${{ hashFiles('scripts/build_universal_libs.sh') }}

      - name: Build universal static libraries
        run: ./scripts/build_universal_libs.sh

      - name: Build FreenectTOP.plugin
        run: |
          xcodebuild -project FreenectTD.xcodeproj -target FreenectTOP \
            -configuration Release \
            FNTD_TD_VERSION=${{ matrix.td_version }} \
            SYMROOT="$PWD/build/td${{ matrix.td_version }}" \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify architectures
        run: |
          BIN=build/td${{ matrix.td_version }}/Release/FreenectTOP.plugin/Contents/MacOS/FreenectTOP
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q x86_64
          lipo -info "$BIN" | grep -q arm64
          otool -L "$BIN"

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: FreenectTOP-universal-TD${{ matrix.td_version }}
          path: build/td${{ matrix.td_version }}/Release/FreenectTOP_v*/
          if-no-files-found: error
